repos:
  - repo: https://github.com/antonbabenko/pre-commit-terraform
    rev: v1.96.1
    hooks:
      - id: terraform_fmt
        files: .*\.tf(vars)?$
        exclude: (^|/)\.terraform/
        
      - id: terraform_validate
        files: .*\.tf(vars)?$
        exclude: (^|/)\.terraform/
        args:
          - --init-args=-backend=false
          
      - id: terraform_tflint
        files: .*\.tf$
        exclude: (^|/)\.terraform/
        args:
          - --args=--minimum-failure-severity=error  # Only fail on errors, not warnings
          
      - id: terraform_docs
        files: .*\.tf$
        exclude: (^|/)\.terraform/
        args:
          - --hook-config=--path-to-file=README.md
          - --hook-config=--add-to-existing-file=true
          - --hook-config=--create-file-if-not-exist=true
        pass_filenames: false
